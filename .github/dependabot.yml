version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Asia/Jakarta"
    assignees:
      - rzkw
    labels:
      - github-actions
    cooldown:
      default-days: 7
      

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: "00:00"
      timezone: "Asia/Jakarta"
    assignees:
      - rzkw
    labels:
      - docker
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "00:00"
      timezone: "Asia/Jakarta"
    assignees:
      - rzkw
    labels:
      - npm
    cooldown:
      default-days: 7
