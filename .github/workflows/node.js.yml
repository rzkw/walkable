# This workflow will update packages in package.json using npx, run test scripts (if present) and create a pull request if tests passed. 
# Written with help from Gemini, Peter Evans' example and Michael Currin's.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Upgrade NPM packages
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * 0" # Weekly rebuild (Sunday at midnight)

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.2.0
      with:
        node-version: '24.x'
        cache: 'npm'
    - run: npm ci
    - run: npm test --if-present
    - run: npm run build --if-present
    
  upgrade-packages:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.1

    - name: Setup Node.js environment
      uses: actions/setup-node@v6.2.0
      with: 
        node-version: '24.x'
        cache: npm

    - name: Update dependencies
      run: |
        npx -p npm-check-updates ncu -u
        npm install
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8.1.0
      with:
          commit-message: Update dependencies
          title: Update dependencies
          body: |
            - Dependency updates

            Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          branch: update-dependencies


 