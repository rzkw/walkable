# This workflow will update packages in package.json using npx, run test scripts (if present) and create a pull request if tests passed. 
# Written with help from Gemini, Peter Evans' example and Michael Currin's.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Upgrade NPM packages weekly

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly rebuild (Sunday at midnight)
  workflow_dispatch:
    
permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
      with:
        egress-policy: audit

    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: '24.x'
        cache: 'npm'
    - run: npm ci
    - run: npm test --if-present
    - run: npm run build --if-present
    
  upgrade-packages:

    runs-on: ubuntu-latest
    permissions:
        contents: write
        pull-requests: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1

    - name: Setup Node.js environment
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with: 
        node-version: '24.x'
        cache: npm

    - name: Update dependencies
      run: |
        npx -p npm-check-updates ncu -u
        npm install
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
          commit-message: Update dependencies
          title: Update dependencies
          body: |
            - Dependency updates

            Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          branch: update-dependencies
          base: main
      

 
